recalculate_weights:
  name: Recalculate weights
  description: >
    Recalculates the regression weights (influence of outdoor temperature, indoor
    temperature, wind and humidity on power) based on the historical
    data in the integration's own HistoryStore. Can e.g. be called weekly by an
    automation.
  fields:
    config_entry_id:
      name: Climate system
      description: >
        Optional: the config entry ID of the climate system for which the weights
        should be recalculated. If empty, all configured systems are
        recalculated.
      required: false
      selector:
        config_entry:
          integration: haeo_klima_forecast

export_history:
  name: Export history
  description: >
    Creates a download link (notification) for the integration's stored hourly
    training data (power, indoor and outdoor temperature, humidity, wind) as a
    CSV file. Nothing is stored on the Home Assistant file system.
  fields:
    config_entry_id:
      name: Climate system
      description: >
        Optional: the config entry ID of the climate system to export. If
        empty, all configured systems are exported.
      required: false
      selector:
        config_entry:
          integration: haeo_klima_forecast
